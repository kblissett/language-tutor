<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spanish Tutor - Practice Your Spanish</title>
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f7;
      --bg-user: #007aff;
      --bg-assistant: #e9ecef;
      --text-primary: #000000;
      --text-secondary: #666666;
      --text-user: #ffffff;
      --border: #d1d1d6;
      --shadow: rgba(0, 0, 0, 0.1);
      --accent: #007aff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1c1c1e;
        --bg-secondary: #2c2c2e;
        --bg-user: #0a84ff;
        --bg-assistant: #2c2c2e;
        --text-primary: #ffffff;
        --text-secondary: #aeaeb2;
        --text-user: #ffffff;
        --border: #38383a;
        --shadow: rgba(0, 0, 0, 0.3);
        --accent: #0a84ff;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-primary);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .scenario-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    .scenario-content {
      min-width: 0;
    }

    .scenario-label {
      display: block;
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .scenario-text {
      display: block;
      color: var(--text-primary);
      font-size: 0.9375rem;
      line-height: 1.35;
    }

    .secondary-btn {
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      font: inherit;
      font-size: 0.875rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, opacity 0.2s;
    }

    .secondary-btn:hover:not(:disabled) {
      background: var(--bg-primary);
    }

    .secondary-btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background: var(--bg-secondary);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      display: flex;
      flex-direction: column;
      animation: slideIn 0.3s ease-out;
      position: relative;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-content {
      padding: 0.875rem 1.125rem;
      border-radius: 1.125rem;
      max-width: 70%;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user-message {
      align-items: flex-end;
    }

    .user-message .message-content {
      background: var(--bg-user);
      color: var(--text-user);
      border-bottom-right-radius: 0.25rem;
    }

    .assistant-message .message-content {
      background: var(--bg-assistant);
      color: var(--text-primary);
      border-bottom-left-radius: 0.25rem;
    }

    .assistant-message .message-content a {
      color: var(--accent);
      text-decoration: underline;
      overflow-wrap: anywhere;
    }

    .thinking {
      color: var(--text-secondary);
      font-style: italic;
    }

    .error-message .message-content {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    @media (prefers-color-scheme: dark) {
      .error-message .message-content {
        background: #450a0a;
        color: #fca5a5;
        border: 1px solid #7f1d1d;
      }
    }

    /* Corrections */
    .corrections-badge {
      background: #fbbf24;
      color: #78350f;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 0.5rem;
      align-self: flex-end;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(251, 191, 36, 0.3);
    }

    .corrections-badge:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 12px rgba(251, 191, 36, 0.4);
    }

    .corrections-badge.active {
      background: #f59e0b;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.5);
    }

    .corrections {
      margin-top: 0.5rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.75rem;
      max-width: 70%;
      align-self: flex-end;
      animation: slideIn 0.3s ease-out;
    }

    .corrections-header {
      font-weight: 600;
      font-size: 0.875rem;
      color: #f59e0b;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .corrections-content {
      font-size: 0.875rem;
      color: var(--text-primary);
      line-height: 1.5;
      white-space: pre-wrap;
    }

    /* Input Area */
    .input-area {
      display: flex;
      gap: 0.75rem;
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      background: var(--bg-primary);
      flex-shrink: 0;
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 1rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      min-height: 44px;
      max-height: 200px;
    }

    #user-input:focus {
      border-color: var(--accent);
    }

    #user-input::placeholder {
      color: var(--text-secondary);
    }

    #user-input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .send-btn {
      background: var(--accent);
      color: white;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, opacity 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      transform: scale(1.05);
    }

    .send-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .modal[hidden] {
      display: none;
    }

    .modal-content {
      background: var(--bg-primary);
      border-radius: 1rem;
      box-shadow: 0 20px 60px var(--shadow);
      width: 100%;
      max-width: 500px;
      animation: modalSlideIn 0.3s ease-out;
    }

    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .modal-body {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-body label {
      font-weight: 500;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .modal-body input {
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .modal-body input:focus {
      border-color: var(--accent);
    }

    .help-text {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .help-text a {
      color: var(--accent);
      text-decoration: none;
    }

    .help-text a:hover {
      text-decoration: underline;
    }

    .primary-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .primary-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .primary-btn:active {
      transform: translateY(0);
    }

    /* Mobile responsiveness */
    @media (max-width: 768px) {
      header {
        padding: 1rem;
      }

      header h1 {
        font-size: 1.25rem;
      }

      .scenario-bar {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
      }

      .secondary-btn {
        width: 100%;
      }

      .messages {
        padding: 1rem;
      }

      .message-content {
        max-width: 85%;
        font-size: 0.9375rem;
      }

      .input-area {
        padding: 0.75rem 1rem;
        gap: 0.5rem;
      }

      .modal-content {
        margin: 1rem;
      }
    }

    /* Scrollbar styling for webkit browsers */
    .messages::-webkit-scrollbar {
      width: 8px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .messages::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Spanish Tutor</h1>
      <button id="settings-btn" class="icon-btn" aria-label="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.67 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z" />
        </svg>
      </button>
    </header>

    <div id="scenario-bar" class="scenario-bar">
      <div class="scenario-content">
        <span class="scenario-label">Your role</span>
        <span id="scenario-text" class="scenario-text"></span>
      </div>
      <button id="disable-scenario-btn" class="secondary-btn" type="button">Disable scenario</button>
    </div>

    <div id="messages" class="messages"></div>

    <div class="input-area">
      <textarea
        id="user-input"
        placeholder="Escribe en español..."
        rows="1"
        aria-label="Message input"
      ></textarea>
      <button id="send-btn" class="send-btn" aria-label="Send message">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
        </svg>
      </button>
    </div>
  </div>

  <div id="settings-modal" class="modal" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings</h2>
        <button id="close-modal" class="icon-btn" aria-label="Close">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <label for="api-key">OpenAI API Key</label>
        <input
          type="password"
          id="api-key"
          placeholder="sk-..."
          autocomplete="off"
        >
        <p class="help-text">
          Your API key is stored locally in your browser and never sent anywhere except OpenAI.
          <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">Get your API key</a>
        </p>
        <button id="save-settings" class="primary-btn">Save</button>
      </div>
    </div>
  </div>

  <script>
    class ChatApp {
        constructor() {
            this.apiKey = null;
            this.messages = [];
            this.isStreaming = false;
            this.hasSentFirstMessage = false;
            this.scenarioEnabled = true;
            this.rolePlayScenarios = [
                { learnerRole: 'You order breakfast at a busy cafe and ask about substitutions.', tutorRole: 'You are the cafe barista taking the order.' },
                { learnerRole: 'You ask about grocery prices, discounts, and payment options.', tutorRole: 'You are the grocery cashier helping at checkout.' },
                { learnerRole: 'You explain mild symptoms and ask for over-the-counter advice.', tutorRole: 'You are the pharmacist asking careful follow-up questions.' },
                { learnerRole: 'You describe symptoms during a routine doctor appointment.', tutorRole: 'You are the doctor leading the appointment.' },
                { learnerRole: 'You schedule, change, or confirm a dentist appointment.', tutorRole: 'You are the dentist receptionist managing the calendar.' },
                { learnerRole: 'You ask about restaurant ingredients, allergies, and recommendations.', tutorRole: 'You are the restaurant server explaining the menu.' },
                { learnerRole: 'You check into a hotel and ask about local transportation.', tutorRole: 'You are the hotel receptionist welcoming the guest.' },
                { learnerRole: 'You give directions to a destination and ask about the fare.', tutorRole: 'You are the taxi driver confirming the route.' },
                { learnerRole: 'You ask about bus routes, delays, and tickets.', tutorRole: 'You are the bus station employee giving travel information.' },
                { learnerRole: 'You boarded the wrong train and need help fixing the trip.', tutorRole: 'You are the train conductor helping the passenger.' },
                { learnerRole: 'You ask about a delayed or missed flight.', tutorRole: 'You are the airport gate agent explaining the options.' },
                { learnerRole: 'You compare rental car options and insurance.', tutorRole: 'You are the car rental agent reviewing the choices.' },
                { learnerRole: 'You explain a problem with your bicycle.', tutorRole: 'You are the bike repair mechanic diagnosing the issue.' },
                { learnerRole: 'You report a broken appliance in your apartment.', tutorRole: 'You are the landlord asking what needs repair.' },
                { learnerRole: 'You tour an apartment and ask about fees.', tutorRole: 'You are the apartment leasing agent answering questions.' },
                { learnerRole: 'You politely discuss a noise problem with a neighbor.', tutorRole: 'You are the neighbor responding to the concern.' },
                { learnerRole: 'You negotiate chores and shared expenses with a roommate.', tutorRole: 'You are the roommate discussing a fair plan.' },
                { learnerRole: 'You explain a repair project and ask what supplies to buy.', tutorRole: 'You are the hardware store employee recommending tools and materials.' },
                { learnerRole: 'You compare phone plans and upgrade options.', tutorRole: 'You are the phone store employee explaining the plans.' },
                { learnerRole: 'You call customer support about an incorrect bill.', tutorRole: 'You are the customer support representative investigating the bill.' },
                { learnerRole: 'You return an online purchase that does not fit.', tutorRole: 'You are the online store representative processing the return.' },
                { learnerRole: 'You open a bank account and ask about fees.', tutorRole: 'You are the bank teller explaining account options.' },
                { learnerRole: 'You discuss saving for a short-term goal.', tutorRole: 'You are the financial advisor helping make a simple plan.' },
                { learnerRole: 'You answer common job interview questions.', tutorRole: 'You are the job interviewer learning about the candidate.' },
                { learnerRole: 'You negotiate schedule, salary, or start date for a new job.', tutorRole: 'You are the hiring manager discussing the offer.' },
                { learnerRole: 'You ask a coworker for help on a deadline.', tutorRole: 'You are the coworker figuring out how to help.' },
                { learnerRole: 'You explain a mistake at work and propose a fix.', tutorRole: 'You are the manager asking practical follow-up questions.' },
                { learnerRole: 'You plan a study session before an exam.', tutorRole: 'You are the classmate coordinating the session.' },
                { learnerRole: 'You ask for clarification after class.', tutorRole: 'You are the teacher explaining the confusing point.' },
                { learnerRole: 'You ask for help finding a book or resource.', tutorRole: 'You are the library worker guiding the search.' },
                { learnerRole: 'You ask about gym classes, memberships, and equipment.', tutorRole: 'You are the gym employee explaining options.' },
                { learnerRole: 'You discuss fitness goals and limitations.', tutorRole: 'You are the personal trainer suggesting a realistic approach.' },
                { learnerRole: 'You describe the haircut or style you want.', tutorRole: 'You are the hair stylist asking about preferences.' },
                { learnerRole: 'You shop for an outfit for a specific event.', tutorRole: 'You are the clothing store associate offering options.' },
                { learnerRole: 'You ask about shoe sizing, comfort, and returns.', tutorRole: 'You are the shoe store associate helping find the right fit.' },
                { learnerRole: 'You ask for a book recommendation.', tutorRole: 'You are the bookstore employee recommending titles.' },
                { learnerRole: 'You ask questions about a museum exhibit.', tutorRole: 'You are the museum guide explaining the exhibit.' },
                { learnerRole: 'You ask about local history and practical travel tips.', tutorRole: 'You are the tour guide leading the conversation.' },
                { learnerRole: 'You make small talk with someone new at a party.', tutorRole: 'You are the party host introducing yourself.' },
                { learnerRole: 'You start a polite conversation at a wedding reception.', tutorRole: 'You are another wedding guest chatting at the reception.' },
                { learnerRole: 'You invite a friend to dinner and work out the details.', tutorRole: 'You are the friend responding to the invitation.' },
                { learnerRole: 'You adjust plans with a friend who is running late.', tutorRole: 'You are the late friend explaining the delay.' },
                { learnerRole: 'You catch up with a family member on a video call.', tutorRole: 'You are the family member asking about recent news.' },
                { learnerRole: 'You make brief friendly small talk with a neighbor in an elevator.', tutorRole: 'You are the neighbor sharing the elevator.' },
                { learnerRole: 'You explain routines, rules, and emergency contacts to a babysitter.', tutorRole: 'You are the babysitter asking what you need to know.' },
                { learnerRole: 'You explain how to care for your pet while you are away.', tutorRole: 'You are the pet sitter confirming the care routine.' },
                { learnerRole: 'You describe a pet issue and schedule a veterinary visit.', tutorRole: 'You are the veterinary receptionist booking the appointment.' },

                { learnerRole: 'You report slow internet service.', tutorRole: 'You are the internet provider agent troubleshooting the problem.' },

                { learnerRole: 'You describe a leak and schedule a repair.', tutorRole: 'You are the plumber gathering details.' },
                { learnerRole: 'You explain a car problem and ask about cost.', tutorRole: 'You are the mechanic explaining possible causes.' },
                { learnerRole: 'You ask about driving lessons and road test practice.', tutorRole: 'You are the driving instructor explaining lesson options.' },
                { learnerRole: 'You plan a short trip within a budget.', tutorRole: 'You are the travel agent suggesting options.' },
                { learnerRole: 'You ask about shared rooms and hostel rules.', tutorRole: 'You are the hostel employee explaining the stay.' },
                { learnerRole: 'You ask what to do on a rainy day while traveling.', tutorRole: 'You are the tourist information clerk suggesting activities.' },
                { learnerRole: 'You ask about trail safety and weather.', tutorRole: 'You are the park ranger giving practical advice.' },
                { learnerRole: 'You coordinate food, timing, and transportation for a picnic.', tutorRole: 'You are the picnic host planning with the group.' },
                { learnerRole: 'You ask for a restaurant table for a group with different needs.', tutorRole: 'You are the restaurant host checking availability.' },
                { learnerRole: 'You ask how to cook a simple family recipe.', tutorRole: 'You are the chef friend explaining the recipe.' },
                { learnerRole: 'You plan easy meals for a busy week.', tutorRole: 'You are the nutritionist suggesting practical meals.' },
                { learnerRole: 'You ask about produce and cooking ideas at a farmers market.', tutorRole: 'You are the farmers market vendor describing what is fresh.' },
                { learnerRole: 'You start a friendly conversation while waiting in a coffee shop line.', tutorRole: 'You are a coffee shop regular chatting in line.' },
                { learnerRole: 'You buy movie tickets and ask about showtimes.', tutorRole: 'You are the movie theater employee selling tickets.' },
                { learnerRole: 'You ask about instruments or music lessons.', tutorRole: 'You are the music store employee explaining options.' },
                { learnerRole: 'You recommend a favorite podcast and explain why you like it.', tutorRole: 'You are a podcast fan asking follow-up questions.' },
                { learnerRole: 'You talk about a recent game or favorite sports team.', tutorRole: 'You are a sports fan discussing the game.' },
                { learnerRole: 'You explain how you like to practice languages.', tutorRole: 'You are a language exchange partner planning practice.' },
                { learnerRole: 'You ask for help setting a study goal.', tutorRole: 'You are the tutor helping define the goal.' },
                { learnerRole: 'You talk through stress and relaxation strategies.', tutorRole: 'You are the counselor listening and asking gentle questions.' },
                { learnerRole: 'You describe evening habits and ask for better sleep ideas.', tutorRole: 'You are the sleep coach suggesting routine changes.' },
                { learnerRole: 'You ask for advice before making a big purchase.', tutorRole: 'You are the friend helping compare options.' },
                { learnerRole: 'You compare neighborhoods and commute options.', tutorRole: 'You are the real estate agent answering practical questions.' },
                { learnerRole: 'You shop for furniture for a small room.', tutorRole: 'You are the furniture store associate suggesting pieces.' },
                { learnerRole: 'You describe what makes a home feel comfortable.', tutorRole: 'You are an interior designer friend asking about preferences.' },
                { learnerRole: 'You ask for directions inside a large building.', tutorRole: 'You are the security guard giving directions.' },
                { learnerRole: 'You introduce yourself professionally at a conference.', tutorRole: 'You are another conference attendee continuing the conversation.' },
                { learnerRole: 'You plan project tasks around a busy calendar.', tutorRole: 'You are the project partner coordinating responsibilities.' },
                { learnerRole: 'You make casual conversation at a school event.', tutorRole: 'You are another parent at the event.' },
                { learnerRole: 'You ask about volunteer duties and schedules.', tutorRole: 'You are the volunteer coordinator explaining the role.' },
                { learnerRole: 'You explain that you missed a doctor appointment.', tutorRole: 'You are the doctor office receptionist rescheduling the visit.' },
                { learnerRole: 'You make a polite complaint about a restaurant order.', tutorRole: 'You are the restaurant manager responding professionally.' },
                { learnerRole: 'You ask for an exception to a return policy.', tutorRole: 'You are the store manager explaining what is possible.' },
                { learnerRole: 'You choose a restaurant with a friend who has different food preferences.', tutorRole: 'You are the friend discussing preferences and constraints.' },
                { learnerRole: 'You change outdoor plans because of rain.', tutorRole: 'You are the weather-conscious friend helping make a new plan.' },
                { learnerRole: 'You give directions in your neighborhood.', tutorRole: 'You are the person asking how to get somewhere nearby.' },
                { learnerRole: 'You explain how to use local public transit.', tutorRole: 'You are the lost tourist trying to understand the route.' },
                { learnerRole: 'You describe your workday during lunch with a colleague.', tutorRole: 'You are the colleague asking about the day.' },
                { learnerRole: 'You share a childhood tradition or memory with an old friend.', tutorRole: 'You are the old friend asking about the memory.' },
                { learnerRole: 'You describe a favorite photo and the story behind it.', tutorRole: 'You are the photographer friend asking about the photo.' },
                { learnerRole: 'You explain what makes a city easy to live in.', tutorRole: 'You are the city planner asking for resident feedback.' },
                { learnerRole: 'You discuss how you stay informed without feeling overwhelmed.', tutorRole: 'You are the journalist asking about media habits.' },
                { learnerRole: 'You talk about sustainable daily habits.', tutorRole: 'You are the environmental volunteer discussing practical changes.' },
                { learnerRole: 'You plan a quiet evening to recharge after a hard day.', tutorRole: 'You are the friend helping make the evening relaxing.' }
            ];
            this.currentScenario = this.pickRandomScenario();
            
            this.messagesContainer = document.getElementById('messages');
            this.userInput = document.getElementById('user-input');
            this.sendBtn = document.getElementById('send-btn');
            this.scenarioText = document.getElementById('scenario-text');
            this.disableScenarioBtn = document.getElementById('disable-scenario-btn');
            this.settingsBtn = document.getElementById('settings-btn');
            this.settingsModal = document.getElementById('settings-modal');
            this.closeModalBtn = document.getElementById('close-modal');
            this.apiKeyInput = document.getElementById('api-key');
            this.saveSettingsBtn = document.getElementById('save-settings');

            this.baseSystemPrompt = `You are a friendly and patient Spanish conversation partner helping language learners practice their Spanish. Your role is to:
- Have natural, engaging conversations entirely in Spanish
- Be warm, approachable, and encouraging
- Keep the conversation flowing by asking follow-up questions
- Adapt to the learner's level while gently introducing new vocabulary
- Use role-play scenarios to make daily Spanish practice practical and engaging
- Be enthusiastic and make learning feel like chatting with a friend
- Do not correct the user's grammar, spelling, word choice, accents, phrasing, or style
- Do not mention mistakes, explain corrections, rewrite the user's message, or provide coaching notes
- Leave all corrections and style feedback to the separate correction model
- Use web search when the user asks you to look something up, asks about current or recent information, or when an accurate answer depends on fresh external facts
- Do not use any form of markup or Markdown in your responses. Do not use headings, bullet lists, numbered lists, tables, code fences, block quotes, bold or italic markers, Markdown links, XML, or HTML tags. Use plain text sentences only.

Remember: You're here to help them practice through conversation only, so always respond in Spanish and keep the conversation going!`;
            this.systemPrompt = this.getSystemPrompt();

            this.init();
        }

        init() {
            this.loadApiKey();
            this.setupEventListeners();
            this.autoResizeTextarea();
            this.renderScenario();

            this.messages.push({
                role: 'system',
                content: this.systemPrompt
            });

            if (!this.apiKey) {
                this.showSettings();
            }
        }

        pickRandomScenario() {
            const index = Math.floor(Math.random() * this.rolePlayScenarios.length);
            return this.rolePlayScenarios[index];
        }

        getSystemPrompt() {
            if (!this.scenarioEnabled) {
                return this.baseSystemPrompt;
            }

            return `${this.baseSystemPrompt}

Role-play scenario for this chat:
Tutor role: ${this.currentScenario.tutorRole}
Learner role: ${this.currentScenario.learnerRole}

Begin in the tutor role unless the learner starts with a different direction. Keep the role play natural, interactive, and entirely in Spanish. The learner sees only the learner role, so do not describe or explain the scenario out of character unless the learner asks.`;
        }

        syncSystemPrompt() {
            this.systemPrompt = this.getSystemPrompt();
            const systemMessage = this.messages.find(message => message.role === 'system');
            if (systemMessage) {
                systemMessage.content = this.systemPrompt;
            }
        }

        renderScenario() {
            if (!this.scenarioEnabled) {
                this.scenarioText.textContent = 'Scenario disabled for this conversation.';
                this.disableScenarioBtn.hidden = true;
                return;
            }

            this.scenarioText.textContent = this.currentScenario.learnerRole;
            this.disableScenarioBtn.hidden = false;
            this.disableScenarioBtn.disabled = this.hasSentFirstMessage;
            this.disableScenarioBtn.textContent = this.hasSentFirstMessage ? 'Scenario fixed' : 'Disable scenario';
        }

        disableScenario() {
            if (this.hasSentFirstMessage) return;

            this.scenarioEnabled = false;
            this.syncSystemPrompt();
            this.renderScenario();
        }

        loadApiKey() {
            const apiKey = localStorage.getItem('openai_api_key');
            if (apiKey) {
                this.apiKey = apiKey;
                this.apiKeyInput.value = apiKey;
            }
        }

        saveApiKey() {
            const apiKey = this.apiKeyInput.value.trim();
            if (!apiKey) {
                alert('Please enter an API key');
                return;
            }

            localStorage.setItem('openai_api_key', apiKey);
            this.apiKey = apiKey;
            this.hideSettings();
        }

        setupEventListeners() {
            this.sendBtn.addEventListener('click', () => this.sendMessage());
            this.disableScenarioBtn.addEventListener('click', () => this.disableScenario());
            this.userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    this.sendMessage();
                }
            });

            this.userInput.addEventListener('input', () => this.autoResizeTextarea());

            this.settingsBtn.addEventListener('click', () => this.showSettings());
            this.closeModalBtn.addEventListener('click', () => this.hideSettings());
            this.saveSettingsBtn.addEventListener('click', () => this.saveApiKey());

            this.settingsModal.addEventListener('click', (e) => {
                if (e.target === this.settingsModal) {
                    this.hideSettings();
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !this.settingsModal.hidden) {
                    this.hideSettings();
                }
            });
        }

        autoResizeTextarea() {
            this.userInput.style.height = 'auto';
            const maxHeight = 200;
            this.userInput.style.height = Math.min(this.userInput.scrollHeight, maxHeight) + 'px';
        }

        showSettings() {
            this.settingsModal.hidden = false;
        }

        hideSettings() {
            this.settingsModal.hidden = true;
        }

        getChatInput() {
            return this.messages
                .filter(message => message.role !== 'system')
                .map(({ role, content }) => ({ role, content }));
        }

        extractResponseOutput(response) {
            const message = response?.output?.find(item => item.type === 'message');
            const outputText = message?.content?.find(part => part.type === 'output_text');

            return {
                text: outputText?.text || '',
                annotations: outputText?.annotations || []
            };
        }

        renderMessageContent(contentDiv, text, annotations = []) {
            const citations = annotations
                .filter(annotation =>
                    annotation.type === 'url_citation' &&
                    annotation.url &&
                    Number.isInteger(annotation.start_index) &&
                    Number.isInteger(annotation.end_index) &&
                    annotation.start_index >= 0 &&
                    annotation.end_index > annotation.start_index &&
                    annotation.end_index <= text.length
                )
                .sort((a, b) => a.start_index - b.start_index);

            contentDiv.textContent = '';

            if (citations.length === 0) {
                contentDiv.textContent = text;
                return;
            }

            let cursor = 0;
            for (const citation of citations) {
                if (citation.start_index < cursor) continue;

                contentDiv.appendChild(document.createTextNode(text.slice(cursor, citation.start_index)));

                const link = document.createElement('a');
                link.href = citation.url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = text.slice(citation.start_index, citation.end_index);
                link.title = citation.title || citation.url;
                contentDiv.appendChild(link);

                cursor = citation.end_index;
            }

            contentDiv.appendChild(document.createTextNode(text.slice(cursor)));
        }

        async sendMessage() {
            if (!this.apiKey) {
                alert('Please set your API key in settings');
                this.showSettings();
                return;
            }

            const content = this.userInput.value.trim();
            if (!content || this.isStreaming) return;

            this.userInput.value = '';
            this.autoResizeTextarea();

            this.hasSentFirstMessage = true;
            this.syncSystemPrompt();
            this.renderScenario();

            this.isStreaming = true;
            this.sendBtn.disabled = true;
            this.userInput.disabled = true;

            let assistantMessageDiv = null;

            try {
                const userMessageElement = this.createMessageElement('user', content);
                this.messages.push({ role: 'user', content });

                assistantMessageDiv = this.createMessageElement('assistant', '...');
                const contentDiv = assistantMessageDiv.querySelector('.message-content');
                contentDiv.classList.add('thinking');

                const correctionsPromise = this.getCorrections(content).catch(err => {
                    console.error('Corrections error:', err);
                    return null;
                });

                const response = await fetch('https://api.openai.com/v1/responses', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${this.apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-5.4-mini',
                        instructions: this.systemPrompt,
                        input: this.getChatInput(),
                        tools: [{ type: 'web_search' }],
                        tool_choice: 'auto',
                        stream: true,
                        store: false
                    }),
                    cache: 'no-cache'
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || `Error ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullContent = '';
                let finalText = '';
                let finalAnnotations = [];
                let buffer = '';
                let hasShownText = false;
                
                contentDiv.textContent = '';
                contentDiv.classList.remove('thinking');

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        const trimmedLine = line.trim();
                        if (!trimmedLine || trimmedLine === 'data: [DONE]') continue;
                        
                        if (trimmedLine.startsWith('data: ')) {
                            let data;
                            try {
                                data = JSON.parse(trimmedLine.slice(6));
                            } catch (e) {
                                continue;
                            }

                            if (data.type === 'response.output_item.added' && data.item?.type === 'web_search_call' && !hasShownText) {
                                contentDiv.textContent = 'Buscando en la web...';
                                contentDiv.classList.add('thinking');
                                this.scrollToBottom();
                            }

                            if (data.type === 'response.output_text.delta') {
                                const delta = data.delta || '';
                                if (!hasShownText) {
                                    contentDiv.textContent = '';
                                    contentDiv.classList.remove('thinking');
                                    hasShownText = true;
                                }
                                fullContent += delta;
                                contentDiv.textContent = fullContent;
                                this.scrollToBottom();
                            }

                            if (data.type === 'response.output_text.done') {
                                finalText = data.text || finalText;
                                finalAnnotations = data.annotations || finalAnnotations;
                            }

                            if (data.type === 'response.content_part.done' && data.part?.type === 'output_text') {
                                finalText = data.part.text || finalText;
                                finalAnnotations = data.part.annotations || finalAnnotations;
                            }

                            if (data.type === 'response.completed') {
                                const output = this.extractResponseOutput(data.response);
                                finalText = output.text || finalText;
                                finalAnnotations = output.annotations || finalAnnotations;
                            }

                            if (data.type === 'response.failed' || data.type === 'response.incomplete') {
                                throw new Error(data.response?.error?.message || 'Response failed');
                            }
                        }
                    }
                }

                const assistantContent = finalText || fullContent;
                contentDiv.classList.remove('thinking');

                if (!assistantContent) {
                    contentDiv.textContent = '(Sin respuesta)';
                } else {
                    this.renderMessageContent(contentDiv, assistantContent, finalAnnotations);
                    this.messages.push({ role: 'assistant', content: assistantContent });
                }

                const corrections = await correctionsPromise;
                if (corrections) {
                    this.addCorrectionsToMessage(userMessageElement, corrections);
                }

            } catch (error) {
                console.error('Chat error:', error);
                const errorMessage = error instanceof Error ? error.message : 'Error desconocido';
                
                if (assistantMessageDiv) {
                    const contentDiv = assistantMessageDiv.querySelector('.message-content');
                    if (contentDiv) {
                        contentDiv.textContent = `Error: ${errorMessage}`;
                        contentDiv.classList.remove('thinking');
                    }
                    assistantMessageDiv.classList.add('error-message');
                } else {
                    this.createMessageElement('assistant', `Error: ${errorMessage}`);
                }

                if (errorMessage.toLowerCase().includes('api key') || errorMessage.includes('401')) {
                    setTimeout(() => this.showSettings(), 1000);
                }
            } finally {
                this.isStreaming = false;
                this.sendBtn.disabled = false;
                this.userInput.disabled = false;
                this.userInput.focus();
            }
        }

        async getCorrections(userMessage) {
            const correctionSystemPrompt = `You are the dedicated correction model for a Spanish tutoring app. The chat model handles conversation and must not correct the user.

Analyze the user's Spanish message for grammar, spelling, word choice, accents, phrasing, and style issues only.

Return corrections only for text that should be changed. If a phrase, sentence, or any part of the user's message is correct, natural, or acceptable, do not mention it at all. Never include confirmations such as "La frase es correcta", "No requiere cambios", "This is correct", or similar.

Do not focus on punctuation; mention punctuation only when it changes meaning or seriously affects readability.

Use comments only for a brief overall note about needed corrections. Do not use comments to mention correct text.

Inside all JSON string values, use plain text only. Do not include any form of markup or Markdown, including headings, bullet lists, numbered lists, tables, code fences, block quotes, bold or italic markers, Markdown links, XML, or HTML tags.

If there are no needed changes, return corrections_needed false, an empty corrections array, and comments null. Respond ONLY with the JSON schema provided.`;

            const correctionSchema = {
                type: 'object',
                properties: {
                    corrections_needed: { type: 'boolean' },
                    corrections: {
                        type: 'array',
                        items: {
                            type: 'object',
                            properties: {
                                type: { type: 'string', enum: ['error', 'style'] },
                                original: { type: 'string' },
                                suggestion: { type: 'string' },
                                explanation: { type: 'string' }
                            },
                            required: ['type', 'original', 'suggestion', 'explanation'],
                            additionalProperties: false
                        }
                    },
                    comments: { type: ['string', 'null'] }
                },
                required: ['corrections_needed', 'corrections', 'comments'],
                additionalProperties: false
            };

            const response = await fetch('https://api.openai.com/v1/responses', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${this.apiKey}`
                },
                body: JSON.stringify({
                    model: 'gpt-5.4-mini',
                    input: [
                        {
                            role: 'system',
                            content: correctionSystemPrompt
                        },
                        {
                            role: 'user',
                            content: userMessage
                        }
                    ],
                    temperature: 0.3,
                    text: {
                        format: {
                            type: 'json_schema',
                            name: 'correction_response',
                            strict: true,
                            schema: correctionSchema
                        }
                    },
                    store: false
                })
            });

            if (!response.ok) return null;
            const data = await response.json();
            const output = this.extractResponseOutput(data);
            const correctionText = data.output_text || output.text;
            return JSON.parse(correctionText || '{}');
        }

        addCorrectionsToMessage(messageElement, correctionData) {
            if (!correctionData.corrections_needed) {
                return;
            }

            const actionableCorrections = correctionData.corrections?.filter(c => {
                const original = c.original?.trim().toLowerCase();
                const suggestion = c.suggestion?.trim().toLowerCase();

                return original && suggestion && original !== suggestion;
            }) || [];
            const comments = correctionData.comments?.trim();

            if (actionableCorrections.length === 0 && !comments) {
                return;
            }

            const correctionLines = actionableCorrections
                .map(c => {
                    const prefix = c.type === 'error' ? 'Error' : 'Style';
                    return `${prefix}: ${c.suggestion}\n→ ${c.explanation}`;
                });
            if (comments) correctionLines.push(comments);

            const correctionsText = correctionLines.join('\n\n');

            const correctionsContainer = document.createElement('div');
            correctionsContainer.className = 'corrections';
            correctionsContainer.hidden = true;

            const correctionsHeader = document.createElement('div');
            correctionsHeader.className = 'corrections-header';
            correctionsHeader.textContent = "💡 Coach's Notes";

            const correctionsContent = document.createElement('div');
            correctionsContent.className = 'corrections-content';
            correctionsContent.textContent = correctionsText;

            correctionsContainer.appendChild(correctionsHeader);
            correctionsContainer.appendChild(correctionsContent);

            const badge = document.createElement('button');
            badge.className = 'corrections-badge';
            badge.textContent = '💡';
            badge.setAttribute('aria-label', 'View corrections');
            badge.onclick = () => {
                const isHidden = correctionsContainer.hidden;
                correctionsContainer.hidden = !isHidden;
                badge.classList.toggle('active', !isHidden);
            };

            messageElement.appendChild(badge);
            messageElement.appendChild(correctionsContainer);
        }

        createMessageElement(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}-message`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;

            messageDiv.appendChild(contentDiv);
            this.messagesContainer.appendChild(messageDiv);
            this.scrollToBottom();

            return messageDiv;
        }

        scrollToBottom() {
            this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
        }
    }

    new ChatApp();
  </script>
