<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spanish Tutor - Practice Your Spanish</title>
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f7;
      --bg-user: #007aff;
      --bg-assistant: #e9ecef;
      --text-primary: #000000;
      --text-secondary: #666666;
      --text-user: #ffffff;
      --border: #d1d1d6;
      --shadow: rgba(0, 0, 0, 0.1);
      --accent: #007aff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1c1c1e;
        --bg-secondary: #2c2c2e;
        --bg-user: #0a84ff;
        --bg-assistant: #2c2c2e;
        --text-primary: #ffffff;
        --text-secondary: #aeaeb2;
        --text-user: #ffffff;
        --border: #38383a;
        --shadow: rgba(0, 0, 0, 0.3);
        --accent: #0a84ff;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-primary);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .scenario-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    .scenario-content {
      flex: 1;
      min-width: 0;
    }

    .scenario-label {
      display: block;
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .scenario-details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.5rem 1rem;
      margin-top: 0.5rem;
    }

    .scenario-field {
      min-width: 0;
    }

    .scenario-field-label {
      display: block;
      color: var(--text-secondary);
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .scenario-field-value {
      display: block;
      color: var(--text-primary);
      font-size: 0.9375rem;
      line-height: 1.35;
    }

    .secondary-btn {
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      font: inherit;
      font-size: 0.875rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, opacity 0.2s;
    }

    .secondary-btn:hover:not(:disabled) {
      background: var(--bg-primary);
    }

    .secondary-btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background: var(--bg-secondary);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      display: flex;
      flex-direction: column;
      animation: slideIn 0.3s ease-out;
      position: relative;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-content {
      padding: 0.875rem 1.125rem;
      border-radius: 1.125rem;
      max-width: 70%;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user-message {
      align-items: flex-end;
    }

    .user-message .message-content {
      background: var(--bg-user);
      color: var(--text-user);
      border-bottom-right-radius: 0.25rem;
    }

    .assistant-message .message-content {
      background: var(--bg-assistant);
      color: var(--text-primary);
      border-bottom-left-radius: 0.25rem;
    }

    .assistant-message .message-content a {
      color: var(--accent);
      text-decoration: underline;
      overflow-wrap: anywhere;
    }

    .thinking {
      color: var(--text-secondary);
      font-style: italic;
    }

    .error-message .message-content {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    @media (prefers-color-scheme: dark) {
      .error-message .message-content {
        background: #450a0a;
        color: #fca5a5;
        border: 1px solid #7f1d1d;
      }
    }

    /* Composer feedback */
    .composer {
      border-top: 1px solid var(--border);
      background: var(--bg-primary);
      flex-shrink: 0;
    }

    .submission-feedback {
      margin: 0.875rem 1.5rem 0;
      padding: 0.875rem 1rem;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 0.75rem;
      color: var(--text-primary);
      animation: slideIn 0.2s ease-out;
    }

    .submission-feedback[hidden] {
      display: none;
    }

    .submission-feedback.error {
      background: #fee2e2;
      border-color: #fecaca;
      color: #991b1b;
    }

    .submission-feedback.checking {
      background: var(--bg-secondary);
      border-color: var(--border);
      color: var(--text-secondary);
    }

    .submission-feedback-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .submission-feedback-title {
      font-size: 0.875rem;
      font-weight: 700;
      color: #9a3412;
    }

    .submission-feedback.error .submission-feedback-title {
      color: #991b1b;
    }

    .submission-feedback.checking .submission-feedback-title {
      color: var(--text-secondary);
    }

    .feedback-list {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }

    .feedback-item {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.875rem;
      line-height: 1.45;
    }

    .feedback-pair {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.35rem;
    }

    .feedback-original {
      color: var(--text-secondary);
      text-decoration: line-through;
    }

    .feedback-arrow {
      color: var(--text-secondary);
    }

    .feedback-suggestion {
      color: var(--text-primary);
      font-weight: 600;
    }

    .feedback-explanation,
    .feedback-comment {
      color: var(--text-secondary);
    }

    @media (prefers-color-scheme: dark) {
      .submission-feedback {
        background: #431407;
        border-color: #7c2d12;
      }

      .submission-feedback.error {
        background: #450a0a;
        border-color: #7f1d1d;
        color: #fca5a5;
      }

      .submission-feedback-title {
        color: #fdba74;
      }

      .submission-feedback.error .submission-feedback-title {
        color: #fca5a5;
      }
    }

    /* Input Area */
    .input-area {
      display: flex;
      gap: 0.75rem;
      padding: 1rem 1.5rem;
      background: transparent;
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 1rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      min-height: 44px;
      max-height: 200px;
    }

    #user-input:focus {
      border-color: var(--accent);
    }

    #user-input::placeholder {
      color: var(--text-secondary);
    }

    #user-input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .send-btn {
      background: var(--accent);
      color: white;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, opacity 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      transform: scale(1.05);
    }

    .send-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .modal[hidden] {
      display: none;
    }

    .modal-content {
      background: var(--bg-primary);
      border-radius: 1rem;
      box-shadow: 0 20px 60px var(--shadow);
      width: 100%;
      max-width: 500px;
      animation: modalSlideIn 0.3s ease-out;
    }

    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .modal-body {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-body label {
      font-weight: 500;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .modal-body input {
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .modal-body input:focus {
      border-color: var(--accent);
    }

    .help-text {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .help-text a {
      color: var(--accent);
      text-decoration: none;
    }

    .help-text a:hover {
      text-decoration: underline;
    }

    .primary-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .primary-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .primary-btn:active {
      transform: translateY(0);
    }

    /* Mobile responsiveness */
    @media (max-width: 768px) {
      header {
        padding: 1rem;
      }

      header h1 {
        font-size: 1.25rem;
      }

      .scenario-bar {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
      }

      .scenario-details {
        grid-template-columns: minmax(0, 1fr);
      }

      .secondary-btn {
        width: 100%;
      }

      .messages {
        padding: 1rem;
      }

      .message-content {
        max-width: 85%;
        font-size: 0.9375rem;
      }

      .input-area {
        padding: 0.75rem 1rem;
        gap: 0.5rem;
      }

      .submission-feedback {
        margin: 0.75rem 1rem 0;
      }

      .modal-content {
        margin: 1rem;
      }
    }

    /* Scrollbar styling for webkit browsers */
    .messages::-webkit-scrollbar {
      width: 8px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .messages::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Spanish Tutor</h1>
      <button id="settings-btn" class="icon-btn" aria-label="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.67 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z" />
        </svg>
      </button>
    </header>

    <div id="scenario-bar" class="scenario-bar">
      <div class="scenario-content">
        <span class="scenario-label">Scenario</span>
        <div id="scenario-details" class="scenario-details"></div>
      </div>
      <button id="disable-scenario-btn" class="secondary-btn" type="button">Disable scenario</button>
    </div>

    <div id="messages" class="messages"></div>

    <div class="composer">
      <div id="correction-feedback" class="submission-feedback" aria-live="polite" hidden></div>
      <div class="input-area">
        <textarea
          id="user-input"
          placeholder="Escribe en español..."
          rows="1"
          aria-label="Message input"
        ></textarea>
        <button id="send-btn" class="send-btn" aria-label="Send message">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="settings-modal" class="modal" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings</h2>
        <button id="close-modal" class="icon-btn" aria-label="Close">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <label for="api-key">OpenAI API Key</label>
        <input
          type="password"
          id="api-key"
          placeholder="sk-..."
          autocomplete="off"
        >
        <p class="help-text">
          Your API key is stored locally in your browser and never sent anywhere except OpenAI.
          <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">Get your API key</a>
        </p>
        <button id="save-settings" class="primary-btn">Save</button>
      </div>
    </div>
  </div>

  <script>
    class ChatApp {
        constructor() {
            this.apiKey = null;
            this.messages = [];
            this.isStreaming = false;
            this.hasSentFirstMessage = false;
            this.scenarioEnabled = true;
            this.rolePlayScenarios = [
                {
                    tutorRole: 'Cafe barista managing a busy morning rush.',
                    learnerRole: 'Customer ordering breakfast before work.',
                    scene: 'A crowded neighborhood cafe with a short line behind you.',
                    learnerGoal: 'Order a filling breakfast, ask for one substitution, and pay quickly.'
                },
                {
                    tutorRole: 'Pharmacist asking careful follow-up questions.',
                    learnerRole: 'Customer with mild cold symptoms.',
                    scene: 'A pharmacy counter on a weekday evening.',
                    learnerGoal: 'Explain your symptoms, choose an over-the-counter medicine, and confirm how to take it safely.'
                },
                {
                    tutorRole: 'Doctor leading a routine appointment.',
                    learnerRole: 'Patient describing a new but non-urgent health concern.',
                    scene: 'A small clinic exam room during an afternoon appointment.',
                    learnerGoal: 'Describe the problem clearly, answer follow-up questions, and understand the next step.'
                },
                {
                    tutorRole: 'Restaurant server explaining the menu.',
                    learnerRole: 'Diner with a food allergy.',
                    scene: 'A busy casual restaurant before a show.',
                    learnerGoal: 'Find a safe meal, ask about ingredients, and place your order before you need to leave.'
                },
                {
                    tutorRole: 'Hotel receptionist welcoming guests.',
                    learnerRole: 'Traveler arriving after a long trip.',
                    scene: 'A hotel lobby late at night.',
                    learnerGoal: 'Check in, ask about breakfast and transportation, and get the room key.'
                },
                {
                    tutorRole: 'Train conductor helping passengers.',
                    learnerRole: 'Passenger who boarded the wrong train.',
                    scene: 'A moving train just after the doors have closed.',
                    learnerGoal: 'Explain the mistake, find the best transfer, and avoid paying more than necessary.'
                },
                {
                    tutorRole: 'Airport gate agent explaining travel options.',
                    learnerRole: 'Traveler dealing with a delayed flight.',
                    scene: 'A crowded airport gate during bad weather.',
                    learnerGoal: 'Understand the delay, protect your connection, and choose the best available option.'
                },
                {
                    tutorRole: 'Landlord asking practical repair questions.',
                    learnerRole: 'Tenant reporting a broken appliance.',
                    scene: 'A phone call from your apartment kitchen.',
                    learnerGoal: 'Describe the problem, arrange a repair time, and ask what to do until it is fixed.'
                },
                {
                    tutorRole: 'Apartment leasing agent answering questions.',
                    learnerRole: 'Apartment hunter touring a new place.',
                    scene: 'An apartment tour in a building you might rent.',
                    learnerGoal: 'Ask about rent, fees, rules, and decide whether to submit an application.'
                },
                {
                    tutorRole: 'Customer support representative investigating a bill.',
                    learnerRole: 'Customer who noticed an incorrect charge.',
                    scene: 'A customer support chat about your latest bill.',
                    learnerGoal: 'Explain the charge, get the bill corrected, and confirm what happens next.'
                },
                {
                    tutorRole: 'Online store representative processing returns.',
                    learnerRole: 'Customer returning an item that does not fit.',
                    scene: 'A support call with your order number nearby.',
                    learnerGoal: 'Start the return, ask about shipping costs, and choose refund or exchange.'
                },
                {
                    tutorRole: 'Bank teller explaining account options.',
                    learnerRole: 'New customer opening a bank account.',
                    scene: 'A bank branch on your lunch break.',
                    learnerGoal: 'Choose an account, understand the fees, and learn what documents are required.'
                },
                {
                    tutorRole: 'Job interviewer learning about a candidate.',
                    learnerRole: 'Applicant interviewing for a part-time job.',
                    scene: 'A video interview with a hiring team member.',
                    learnerGoal: 'Introduce your experience, answer common questions, and ask about the schedule.'
                },
                {
                    tutorRole: 'Hiring manager discussing an offer.',
                    learnerRole: 'Candidate who received a job offer.',
                    scene: 'A final phone call before accepting the offer.',
                    learnerGoal: 'Negotiate schedule, salary, or start date while staying polite and professional.'
                },
                {
                    tutorRole: 'Coworker figuring out how to help.',
                    learnerRole: 'Employee facing a deadline.',
                    scene: 'A quick conversation near a shared workspace.',
                    learnerGoal: 'Ask for help, divide the work, and agree on a realistic timeline.'
                },
                {
                    tutorRole: 'Teacher explaining a confusing point.',
                    learnerRole: 'Student asking for clarification after class.',
                    scene: 'A classroom a few minutes after the lesson ends.',
                    learnerGoal: 'Explain what you did not understand and leave with one concrete study task.'
                },
                {
                    tutorRole: 'Gym employee explaining memberships and classes.',
                    learnerRole: 'New visitor comparing fitness options.',
                    scene: 'A gym front desk during an open house.',
                    learnerGoal: 'Find a membership or class that fits your schedule, budget, and fitness level.'
                },
                {
                    tutorRole: 'Hair stylist asking about preferences.',
                    learnerRole: 'Client getting a haircut before an event.',
                    scene: 'A salon chair with photos open on your phone.',
                    learnerGoal: 'Describe the style you want and agree on length, shape, and timing.'
                },
                {
                    tutorRole: 'Clothing store associate offering options.',
                    learnerRole: 'Shopper preparing for a specific event.',
                    scene: 'A clothing store fitting room area.',
                    learnerGoal: 'Find an outfit in the right size, style, and price range.'
                },
                {
                    tutorRole: 'Museum guide explaining an exhibit.',
                    learnerRole: 'Visitor curious about a famous object.',
                    scene: 'A museum gallery during a guided tour.',
                    learnerGoal: 'Ask thoughtful questions and understand why the exhibit matters.'
                },
                {
                    tutorRole: 'Friend responding to an invitation.',
                    learnerRole: 'Friend planning a casual dinner.',
                    scene: 'A text conversation while both people are making weekend plans.',
                    learnerGoal: 'Choose a time, place, and meal plan that works for both of you.'
                },
                {
                    tutorRole: 'Babysitter asking what they need to know.',
                    learnerRole: 'Parent preparing to leave for the evening.',
                    scene: 'Your home just before the babysitter starts.',
                    learnerGoal: 'Explain routines, rules, food, and emergency contacts clearly.'
                },
                {
                    tutorRole: 'Post office clerk explaining shipping choices.',
                    learnerRole: 'Customer mailing an important package.',
                    scene: 'A post office counter with people waiting behind you.',
                    learnerGoal: 'Choose a shipping speed, ask about tracking, and make sure the address is correct.'
                },
                {
                    tutorRole: 'Police officer taking a report.',

- Have natural, engaging conversations entirely in Spanish
- Be warm, approachable, and encouraging
- Keep the conversation flowing by asking follow-up questions
- Adapt to the learner's level while gently introducing new vocabulary
- Use role-play scenarios to make daily Spanish practice practical and engaging
- Be enthusiastic and make learning feel like chatting with a friend
- Do not correct the user's grammar, spelling, word choice, accents, phrasing, or style
- Do not mention mistakes, explain corrections, rewrite the user's message, or provide coaching notes
- Leave all corrections and style feedback to the separate correction model
- Use web search when the user asks you to look something up, asks about current or recent information, or when an accurate answer depends on fresh external facts
- Do not use any form of markup or Markdown in your responses. Do not use headings, bullet lists, numbered lists, tables, code fences, block quotes, bold or italic markers, Markdown links, XML, or HTML tags. Use plain text sentences only.

Remember: You're here to help them practice through conversation only, so always respond in Spanish and keep the conversation going!`;

        init() {
            this.loadApiKey();
            this.setupEventListeners();
            this.autoResizeTextarea();
            this.renderScenario();

            this.messages.push({
                role: 'system',
                content: this.systemPrompt
            });

            if (!this.apiKey) {
                this.showSettings();
            }
        }

        pickRandomScenario() {
            const index = Math.floor(Math.random() * this.rolePlayScenarios.length);
            return this.rolePlayScenarios[index];
        }

        getSystemPrompt() {
            if (!this.scenarioEnabled) {
                return this.baseSystemPrompt;
            }

            return `${this.baseSystemPrompt}

Role-play scenario for this chat:
Tutor role: ${this.currentScenario.tutorRole}
Learner role: ${this.currentScenario.learnerRole}
Scene: ${this.currentScenario.scene}
Learner goal: ${this.currentScenario.learnerGoal}

Begin in the tutor role unless the learner starts with a different direction. Keep the role play natural, interactive, and entirely in Spanish.

The learner can see the full scenario at the top of the page. Do not restate the scenario out of character unless the learner asks.

The learner is trying to accomplish the learner goal. Help them succeed if they communicate clearly and make reasonable choices.

During the conversation, introduce about three small, realistic obstacles in character. Space them out and introduce only one obstacle at a time. Obstacles can include missing information, a policy, limited availability, a misunderstanding, a time constraint, an extra requirement, or a simple complication from the scene. Do not make the goal impossible, do not trap the learner, and do not reveal obstacle numbers or game mechanics.

If the learner gets stuck, offer a natural hint in Spanish while staying in the tutor role.`;
        }

        syncSystemPrompt() {
            this.systemPrompt = this.getSystemPrompt();
            const systemMessage = this.messages.find(message => message.role === 'system');
            if (systemMessage) {
                systemMessage.content = this.systemPrompt;
            }
        }

        renderScenario() {
            this.scenarioDetails.textContent = '';

            if (!this.scenarioEnabled) {
                this.scenarioDetails.appendChild(this.createScenarioField('Status', 'Scenario disabled for this conversation.'));
                this.disableScenarioBtn.hidden = true;
                return;
            }

            [
                ['Tutor', this.currentScenario.tutorRole],
                ['Learner', this.currentScenario.learnerRole],
                ['Scene', this.currentScenario.scene],
                ['Goal', this.currentScenario.learnerGoal]
            ].forEach(([label, value]) => {
                this.scenarioDetails.appendChild(this.createScenarioField(label, value));
            });

            this.disableScenarioBtn.hidden = false;
            this.disableScenarioBtn.disabled = this.hasSentFirstMessage;
            this.disableScenarioBtn.textContent = this.hasSentFirstMessage ? 'Scenario fixed' : 'Disable scenario';
        }

        createScenarioField(label, value) {
            const field = document.createElement('div');
            field.className = 'scenario-field';

            const fieldLabel = document.createElement('span');
            fieldLabel.className = 'scenario-field-label';
            fieldLabel.textContent = label;

            const fieldValue = document.createElement('span');
            fieldValue.className = 'scenario-field-value';
            fieldValue.textContent = value;

            field.appendChild(fieldLabel);
            field.appendChild(fieldValue);
            return field;
        }

        disableScenario() {
            if (this.hasSentFirstMessage) return;

            this.scenarioEnabled = false;
            this.syncSystemPrompt();
            this.renderScenario();
        }

        loadApiKey() {
            const apiKey = localStorage.getItem('openai_api_key');
            if (apiKey) {
                this.apiKey = apiKey;
                this.apiKeyInput.value = apiKey;
            }
        }

        saveApiKey() {
            const apiKey = this.apiKeyInput.value.trim();
            if (!apiKey) {
                alert('Please enter an API key');
                return;
            }

            localStorage.setItem('openai_api_key', apiKey);
            this.apiKey = apiKey;
            this.hideSettings();
        }

        setupEventListeners() {
            this.sendBtn.addEventListener('click', () => this.sendMessage());
            this.disableScenarioBtn.addEventListener('click', () => this.disableScenario());
            this.userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    this.sendMessage();
                }
            });

            this.userInput.addEventListener('input', () => {
                this.autoResizeTextarea();
                if (!this.userInput.value.trim()) {
                    this.clearSubmissionFeedback();
                }
            });

            this.settingsBtn.addEventListener('click', () => this.showSettings());
            this.closeModalBtn.addEventListener('click', () => this.hideSettings());
            this.saveSettingsBtn.addEventListener('click', () => this.saveApiKey());

            this.settingsModal.addEventListener('click', (e) => {
                if (e.target === this.settingsModal) {
                    this.hideSettings();
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !this.settingsModal.hidden) {
                    this.hideSettings();
                }
            });
        }

        autoResizeTextarea() {
            this.userInput.style.height = 'auto';
            const maxHeight = 200;
            this.userInput.style.height = Math.min(this.userInput.scrollHeight, maxHeight) + 'px';
        }

        showSettings() {
            this.settingsModal.hidden = false;
        }

        hideSettings() {
            this.settingsModal.hidden = true;
        }

        getChatInput() {
            return this.messages
                .filter(message => message.role !== 'system')
                .map(({ role, content }) => ({ role, content }));
        }

        extractResponseOutput(response) {
            const message = response?.output?.find(item => item.type === 'message');
            const outputText = message?.content?.find(part => part.type === 'output_text');

            return {
                text: outputText?.text || '',
                annotations: outputText?.annotations || []
            };
        }

        renderMessageContent(contentDiv, text, annotations = []) {
            const citations = annotations
                .filter(annotation =>
                    annotation.type === 'url_citation' &&
                    annotation.url &&
                    Number.isInteger(annotation.start_index) &&
                    Number.isInteger(annotation.end_index) &&
                    annotation.start_index >= 0 &&
                    annotation.end_index > annotation.start_index &&
                    annotation.end_index <= text.length
                )
                .sort((a, b) => a.start_index - b.start_index);

            contentDiv.textContent = '';

            if (citations.length === 0) {
                contentDiv.textContent = text;
                return;
            }

            let cursor = 0;
            for (const citation of citations) {
                if (citation.start_index < cursor) continue;

                contentDiv.appendChild(document.createTextNode(text.slice(cursor, citation.start_index)));

                const link = document.createElement('a');
                link.href = citation.url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = text.slice(citation.start_index, citation.end_index);
                link.title = citation.title || citation.url;
                contentDiv.appendChild(link);

                cursor = citation.end_index;
            }

            contentDiv.appendChild(document.createTextNode(text.slice(cursor)));
        }

        showCheckingFeedback() {
            this.correctionFeedback.className = 'submission-feedback checking';
            this.correctionFeedback.textContent = '';

            const header = document.createElement('div');
            header.className = 'submission-feedback-header';

            const title = document.createElement('div');
            title.className = 'submission-feedback-title';
            title.textContent = 'Checking your Spanish...';

            header.appendChild(title);
            this.correctionFeedback.appendChild(header);
            this.correctionFeedback.hidden = false;
        }

        clearSubmissionFeedback() {
            this.correctionFeedback.hidden = true;
            this.correctionFeedback.textContent = '';
            this.correctionFeedback.className = 'submission-feedback';
        }

        getActionableCorrections(correctionData) {
            if (!correctionData?.corrections_needed) {
                return [];
            }

            return correctionData.corrections?.filter(c => {
                const original = c.original?.trim();
                const suggestion = c.suggestion?.trim();

                return original && suggestion && original.toLowerCase() !== suggestion.toLowerCase();
            }) || [];
        }

        hasBlockingCorrections(correctionData) {
            const corrections = this.getActionableCorrections(correctionData);

            return corrections.length > 0;
        }

        showSubmissionFeedback(correctionData) {
            const corrections = this.getActionableCorrections(correctionData);
            const comments = correctionData.comments?.trim();

            if (corrections.length === 0) {
                this.clearSubmissionFeedback();
                return;
            }

            this.correctionFeedback.className = 'submission-feedback';
            this.correctionFeedback.textContent = '';

            const header = document.createElement('div');
            header.className = 'submission-feedback-header';

            const title = document.createElement('div');
            title.className = 'submission-feedback-title';
            title.textContent = corrections.length === 1 ? 'One quick fix before sending' : 'A few quick fixes before sending';

            header.appendChild(title);
            this.correctionFeedback.appendChild(header);

            const list = document.createElement('div');
            list.className = 'feedback-list';

            corrections.forEach(correction => {
                const item = document.createElement('div');
                item.className = 'feedback-item';

                const pair = document.createElement('div');
                pair.className = 'feedback-pair';

                const original = document.createElement('span');
                original.className = 'feedback-original';
                original.textContent = correction.original;

                const arrow = document.createElement('span');
                arrow.className = 'feedback-arrow';
                arrow.textContent = '→';

                const suggestion = document.createElement('span');
                suggestion.className = 'feedback-suggestion';
                suggestion.textContent = correction.suggestion;

                pair.appendChild(original);
                pair.appendChild(arrow);
                pair.appendChild(suggestion);

                const explanation = document.createElement('div');
                explanation.className = 'feedback-explanation';
                explanation.textContent = correction.explanation;

                item.appendChild(pair);
                item.appendChild(explanation);
                list.appendChild(item);
            });

            if (comments) {
                const comment = document.createElement('div');
                comment.className = 'feedback-comment';
                comment.textContent = comments;
                list.appendChild(comment);
            }

            this.correctionFeedback.appendChild(list);
            this.correctionFeedback.hidden = false;
        }

        showSubmissionError(message) {
            this.correctionFeedback.className = 'submission-feedback error';
            this.correctionFeedback.textContent = '';

            const header = document.createElement('div');
            header.className = 'submission-feedback-header';

            const title = document.createElement('div');
            title.className = 'submission-feedback-title';
            title.textContent = 'Could not check the draft';

            header.appendChild(title);

            const detail = document.createElement('div');
            detail.className = 'feedback-comment';
            detail.textContent = message;

            this.correctionFeedback.appendChild(header);
            this.correctionFeedback.appendChild(detail);
            this.correctionFeedback.hidden = false;
        }

        async sendMessage() {
            if (!this.apiKey) {
                alert('Please set your API key in settings');
                this.showSettings();
                return;
            }

            const content = this.userInput.value.trim();
            if (!content || this.isStreaming) return;

            this.isStreaming = true;
            this.sendBtn.disabled = true;
            this.userInput.disabled = true;
            this.sendBtn.setAttribute('aria-label', 'Checking draft');
            this.showCheckingFeedback();

            let assistantMessageDiv = null;

            try {
                const corrections = await this.getCorrections(content);
                if (this.hasBlockingCorrections(corrections)) {
                    this.showSubmissionFeedback(corrections);
                    return;
                }

                this.clearSubmissionFeedback();
                this.userInput.value = '';
                this.autoResizeTextarea();

                this.hasSentFirstMessage = true;
                this.syncSystemPrompt();
                this.renderScenario();

                this.createMessageElement('user', content);
                this.messages.push({ role: 'user', content });

                assistantMessageDiv = this.createMessageElement('assistant', '...');
                const contentDiv = assistantMessageDiv.querySelector('.message-content');
                contentDiv.classList.add('thinking');

                const response = await fetch('https://api.openai.com/v1/responses', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${this.apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-5.4-mini',
                        instructions: this.systemPrompt,
                        input: this.getChatInput(),
                        tools: [{ type: 'web_search' }],
                        tool_choice: 'auto',
                        stream: true,
                        store: false
                    }),
                    cache: 'no-cache'
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || `Error ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullContent = '';
                let finalText = '';
                let finalAnnotations = [];
                let buffer = '';
                let hasShownText = false;
                
                contentDiv.textContent = '';
                contentDiv.classList.remove('thinking');

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        const trimmedLine = line.trim();
                        if (!trimmedLine || trimmedLine === 'data: [DONE]') continue;
                        
                        if (trimmedLine.startsWith('data: ')) {
                            let data;
                            try {
                                data = JSON.parse(trimmedLine.slice(6));
                            } catch (e) {
                                continue;
                            }

                            if (data.type === 'response.output_item.added' && data.item?.type === 'web_search_call' && !hasShownText) {
                                contentDiv.textContent = 'Buscando en la web...';
                                contentDiv.classList.add('thinking');
                                this.scrollToBottom();
                            }

                            if (data.type === 'response.output_text.delta') {
                                const delta = data.delta || '';
                                if (!hasShownText) {
                                    contentDiv.textContent = '';
                                    contentDiv.classList.remove('thinking');
                                    hasShownText = true;
                                }
                                fullContent += delta;
                                contentDiv.textContent = fullContent;
                                this.scrollToBottom();
                            }

                            if (data.type === 'response.output_text.done') {
                                finalText = data.text || finalText;
                                finalAnnotations = data.annotations || finalAnnotations;
                            }

                            if (data.type === 'response.content_part.done' && data.part?.type === 'output_text') {
                                finalText = data.part.text || finalText;
                                finalAnnotations = data.part.annotations || finalAnnotations;
                            }

                            if (data.type === 'response.completed') {
                                const output = this.extractResponseOutput(data.response);
                                finalText = output.text || finalText;
                                finalAnnotations = output.annotations || finalAnnotations;
                            }

                            if (data.type === 'response.failed' || data.type === 'response.incomplete') {
                                throw new Error(data.response?.error?.message || 'Response failed');
                            }
                        }
                    }
                }

                const assistantContent = finalText || fullContent;
                contentDiv.classList.remove('thinking');

                if (!assistantContent) {
                    contentDiv.textContent = '(Sin respuesta)';
                } else {
                    this.renderMessageContent(contentDiv, assistantContent, finalAnnotations);
                    this.messages.push({ role: 'assistant', content: assistantContent });
                }

            } catch (error) {
                console.error('Chat error:', error);
                const errorMessage = error instanceof Error ? error.message : 'Error desconocido';
                
                if (assistantMessageDiv) {
                    const contentDiv = assistantMessageDiv.querySelector('.message-content');
                    if (contentDiv) {
                        contentDiv.textContent = `Error: ${errorMessage}`;
                        contentDiv.classList.remove('thinking');
                    }
                    assistantMessageDiv.classList.add('error-message');
                } else {
                    this.showSubmissionError(`I could not check that yet: ${errorMessage}`);
                }

                if (errorMessage.toLowerCase().includes('api key') || errorMessage.includes('401')) {
                    setTimeout(() => this.showSettings(), 1000);
                }
            } finally {
                this.isStreaming = false;
                this.sendBtn.disabled = false;
                this.userInput.disabled = false;
                this.sendBtn.setAttribute('aria-label', 'Send message');
                this.userInput.focus();
            }
        }

        async getCorrections(userMessage) {
            const correctionSystemPrompt = `You are the dedicated correction model for a Spanish tutoring app. The chat model handles conversation and must not correct the user.

Analyze the user's Spanish message for grammar, spelling, word choice, accents, phrasing, and style issues only.

Return corrections only for text that definitely should be changed before the tutor sees it. Each correction must be concrete and actionable: original must be an exact substring copied from the user's message, suggestion must be the replacement text the learner should type, and explanation must briefly explain why that exact edit is needed.

Do not block the user for broad, optional, or subjective style preferences. Do not block for minor punctuation, accent, capitalization, or typography preferences unless they materially affect meaning, correctness, or readability. Never return vague notes such as "there is a small style adjustment" unless you also provide the exact original text and exact replacement in corrections.

If a phrase, sentence, or any part of the user's message is correct, natural, or acceptable, do not mention it at all. Never include confirmations such as "La frase es correcta", "No requiere cambios", "This is correct", or similar.

Do not focus on punctuation or capitalization; mention them only when they change meaning or seriously affect readability.

Use comments only for a brief overall note about the listed corrections. If corrections is empty, comments must be null.

Inside all JSON string values, use plain text only. Do not include any form of markup or Markdown, including headings, bullet lists, numbered lists, tables, code fences, block quotes, bold or italic markers, Markdown links, XML, or HTML tags.

If there are no concrete needed changes, return corrections_needed false, an empty corrections array, and comments null. Respond ONLY with the JSON schema provided.`;

            const correctionSchema = {
                type: 'object',
                properties: {
                    corrections_needed: { type: 'boolean' },
                    corrections: {
                        type: 'array',
                        items: {
                            type: 'object',
                            properties: {
                                type: { type: 'string', enum: ['error', 'style'] },
                                original: { type: 'string' },
                                suggestion: { type: 'string' },
                                explanation: { type: 'string' }
                            },
                            required: ['type', 'original', 'suggestion', 'explanation'],
                            additionalProperties: false
                        }
                    },
                    comments: { type: ['string', 'null'] }
                },
                required: ['corrections_needed', 'corrections', 'comments'],
                additionalProperties: false
            };

            const response = await fetch('https://api.openai.com/v1/responses', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${this.apiKey}`
                },
                body: JSON.stringify({
                    model: 'gpt-5.4-mini',
                    input: [
                        {
                            role: 'system',
                            content: correctionSystemPrompt
                        },
                        {
                            role: 'user',
                            content: userMessage
                        }
                    ],
                    temperature: 0.3,
                    text: {
                        format: {
                            type: 'json_schema',
                            name: 'correction_response',
                            strict: true,
                            schema: correctionSchema
                        }
                    },
                    store: false
                })
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.error?.message || `Error ${response.status}`);
            }

            const data = await response.json();
            const output = this.extractResponseOutput(data);
            const correctionText = data.output_text || output.text;
            if (!correctionText) {
                throw new Error('No correction response');
            }

            return JSON.parse(correctionText);
        }

        createMessageElement(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}-message`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;

            messageDiv.appendChild(contentDiv);
            this.messagesContainer.appendChild(messageDiv);
            this.scrollToBottom();

            return messageDiv;
        }

        scrollToBottom() {
            this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
        }
    }

    new ChatApp();
  </script>
</body>
